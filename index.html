<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Hero - גיבור הלמידה החכמה</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CFJ2PMQPKX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-CFJ2PMQPKX');
    </script>

    <link rel="stylesheet" href="promptmaster.css?v=5">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>

<body>
    <nav class="navbar">
        <div class="navbar-logo">Learning Hero</div>
        <ul class="navbar-links">
            <li><a href="#generators">המחוללים</a></li>
            <li><a href="about.html">אודות</a></li>
        </ul>
    </nav>

    <div class="site-hero">
        <div class="hero-badge">כלים לאנשי הדרכה</div>
        <h1>Learning Hero</h1>
        <div class="hero-steps">
            <div class="hero-step">
                <span class="hero-step-num">1</span>
                <span class="hero-step-text">בחרו מחולל</span>
            </div>
            <span class="hero-step-arrow" aria-hidden="true">&#8592;</span>
            <div class="hero-step">
                <span class="hero-step-num">2</span>
                <span class="hero-step-text">מלאו את הפרטים</span>
            </div>
            <span class="hero-step-arrow" aria-hidden="true">&#8592;</span>
            <div class="hero-step">
                <span class="hero-step-num">3</span>
                <span class="hero-step-text">העתיקו לכלי AI</span>
            </div>
        </div>
    </div>

    <div class="container-home">
        <div id="generators" class="filter-bar">
            <input type="text" id="generator-search" class="search-input" placeholder="חיפוש מחולל...">
            <div class="filter-buttons">
                <button class="filter-btn active" data-category="all">הכל</button>
                <button class="filter-btn" data-category="learning">למידה והדרכה</button>
                <button class="filter-btn" data-category="guidance">הנחיה ותרגול</button>
                <button class="filter-btn" data-category="visual">יצירה ויזואלית</button>
            </div>
            <select id="sort-select" class="sort-select">
                <option value="alpha" selected>א–ת</option>
                <option value="default">סדר הוספה</option>
            </select>
        </div>

        <div id="generators-grid"></div>
    </div>

    <footer class="site-footer">
        <div class="footer-ai-links">
            <span>קישורים מהירים לכלי AI:</span>
            <a href="https://chat.openai.com/" target="_blank">ChatGPT</a>
            <span class="sep">|</span>
            <a href="https://claude.ai/" target="_blank">Claude</a>
            <span class="sep">|</span>
            <a href="https://gemini.google.com/" target="_blank">Gemini</a>
        </div>
        <div class="footer-meta">
            <strong>Learning Hero © 2025</strong><br>
            Created with ❤️ by Ruthy Salomon<br>
            פותח עבור שיפור תהליכי למידה והדרכה
        </div>
    </footer>

    <script src="generators-config.js"></script>
    <script src="promptmasterjs.js"></script>
    <script>
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            });
        });

        initGeneratorsPage();
    </script>
</body>
</html>

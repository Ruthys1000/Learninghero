<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>בניית מחולל חדש | Learning Hero</title>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CFJ2PMQPKX"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-CFJ2PMQPKX');
    </script>

    <link rel="stylesheet" href="promptmaster.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="global-navbar-container"></div>

    <div class="container">
        <div class="header">
            <h1>בנה מחולל חדש</h1>
            <p>הגדר שדות, כתוב פרומפט — וקבל קוד config מוכן להדבקה</p>
        </div>

        <!-- ── 1. פרטי המחולל ── -->
        <div class="section">
            <h2 class="section-title"><span class="section-number">1</span>פרטי המחולל</h2>

            <div class="builder-row">
                <div class="input-group">
                    <label class="builder-label" for="b-id">מזהה (id) <span style="font-weight:400;color:#94a3b8">— אותיות אנגלית ומקפים בלבד</span></label>
                    <input type="text" id="b-id" placeholder="my-generator" oninput="updateCode()">
                </div>
                <div class="input-group">
                    <label class="builder-label" for="b-title">שם המחולל</label>
                    <input type="text" id="b-title" placeholder="מחולל שלי" oninput="updateCode()">
                </div>
                <div class="input-group">
                    <label class="builder-label" for="b-category">קטגוריה</label>
                    <select id="b-category" onchange="updateCode()">
                        <option value="learning">למידה והדרכה</option>
                        <option value="guidance">הנחיה ותרגול</option>
                        <option value="visual">יצירה ויזואלית</option>
                    </select>
                </div>
                <div class="input-group">
                    <label class="builder-label" for="b-icon">אייקון</label>
                    <select id="b-icon" onchange="updateCode()">
                        <option value="bookOpen">bookOpen — ספר</option>
                        <option value="bolt">bolt — ברק</option>
                        <option value="clipboard">clipboard — לוח</option>
                        <option value="users">users — אנשים</option>
                        <option value="chat">chat — בועת שיחה</option>
                        <option value="play">play — הפעלה</option>
                        <option value="eye">eye — עין</option>
                        <option value="photo">photo — תמונה</option>
                        <option value="film">film — סרט</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label class="builder-label" for="b-description">תיאור קצר <span style="font-weight:400;color:#94a3b8">(מוצג בכרטיסייה בדף הבית)</span></label>
                <textarea id="b-description" rows="2" placeholder="מחולל ש..." oninput="updateCode()"></textarea>
            </div>

            <div class="builder-row">
                <div class="input-group">
                    <label class="builder-label" for="b-tagline">כותרת משנה (tagline) <span style="font-weight:400;color:#94a3b8">אופציונלי</span></label>
                    <input type="text" id="b-tagline" placeholder="כותרת קצרה בראש עמוד המחולל" oninput="updateCode()">
                </div>
                <div class="input-group">
                    <label class="builder-label" for="b-submit">טקסט כפתור שליחה</label>
                    <input type="text" id="b-submit" placeholder="צור פרומפט" oninput="updateCode()">
                </div>
            </div>

            <div class="input-group">
                <label class="builder-label" for="b-info">תיבת "איך זה עובד?" <span style="font-weight:400;color:#94a3b8">אופציונלי — HTML מותר</span></label>
                <textarea id="b-info" rows="3" placeholder="הסבר קצר על מה המחולל עושה..." oninput="updateCode()"></textarea>
            </div>
        </div>

        <!-- ── 2. שדות הטופס ── -->
        <div class="section">
            <h2 class="section-title"><span class="section-number">2</span>שדות הטופס</h2>
            <div id="sections-container"></div>
            <button type="button" class="btn-add-section" onclick="addSection()">+ הוסף חלק לטופס</button>
        </div>

        <!-- ── 3. buildPrompt ── -->
        <div class="section">
            <h2 class="section-title"><span class="section-number">3</span>buildPrompt — גוף הפונקציה</h2>
            <div id="data-keys-preview" class="data-keys-preview">
                <em>הוסף שדות בשלב 2 כדי לראות מפתחות זמינים</em>
            </div>
            <div class="input-group">
                <label class="builder-label">כתוב את גוף הפונקציה. מה שמוחזר הוא הפרומפט הסופי.</label>
                <textarea id="b-prompt-body" rows="12" class="builder-textarea-code"
                    placeholder="return \`# כותרת\n\n**נושא:** \${data.topic}\n**רמה:** \${data.level}\n\n---\n\nהנחיות ל-AI...\`;"
                    oninput="updateCode()"></textarea>
            </div>
        </div>

        <!-- ── 4. קוד מוכן ── -->
        <div class="section">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
                <h2 class="section-title" style="margin:0"><span class="section-number">4</span>קוד config מוכן להדבקה</h2>
                <button onclick="copyCode()" class="copy-button">העתק קוד</button>
            </div>
            <p style="color:var(--text-secondary);font-size:0.9em;margin-bottom:14px">
                הדבק את הקוד הבא בתוך מערך <code style="background:#f1f5f9;padding:2px 6px;border-radius:4px">GENERATORS</code> ב-<strong>generators-config.js</strong>
            </p>
            <pre id="code-output" class="code-output">// מלא את הפרטים למעלה כדי לייצר קוד</pre>
        </div>
    </div>

    <div id="global-footer"></div>
    <script src="promptmasterjs.js"></script>
    <script src="generators-config.js"></script>
    <script>
    /* ── State ── */
    const sections = [];

    /* ── Section / Field management ── */

    function addSection() {
        sections.push({ title: '', fields: [] });
        renderSections();
        updateCode();
    }

    function removeSection(si) {
        sections.splice(si, 1);
        renderSections();
        updateCode();
    }

    function addField(si) {
        sections[si].fields.push({ type: 'text', id: '', label: '', placeholder: '', required: false, helperText: '', rows: 4 });
        renderSections();
        updateCode();
    }

    function removeField(si, fi) {
        sections[si].fields.splice(fi, 1);
        renderSections();
        updateCode();
    }

    function changeFieldType(si, fi, type) {
        const f = sections[si].fields[fi];
        f.type = type;
        if ((type === 'radio' || type === 'checkbox') && !f.options) {
            f.name = f.name || '';
            f.layout = '2col';
            f.options = [{ id: '', value: '', label: '' }];
        }
        if (type === 'select' && !f.options) {
            f.options = [{ value: '', label: '', selected: false }];
        }
        if (type === 'inline' && !f.inputs) {
            f.inputs = [{ type: 'number', id: '', helperText: '' }];
        }
        renderSections();
        updateCode();
    }

    /* ── Render ── */

    function renderSections() {
        document.getElementById('sections-container').innerHTML =
            sections.map((s, si) => renderSectionCard(s, si)).join('');
        updateDataKeysPreview();
    }

    function renderSectionCard(section, si) {
        return `<div class="builder-section-card">
            <div class="builder-header-row">
                <input type="text" value="${esc(section.title)}" placeholder="שם החלק (לדוג׳: פרטי בסיס)"
                    oninput="sections[${si}].title = this.value; updateCode()">
                <button class="btn-remove" onclick="removeSection(${si})">✕ הסר חלק</button>
            </div>
            ${section.fields.map((f, fi) => renderFieldCard(f, si, fi)).join('')}
            <button class="btn-add-secondary" onclick="addField(${si})">+ הוסף שדה</button>
        </div>`;
    }

    function renderFieldCard(field, si, fi) {
        return `<div class="builder-field-card">
            <div class="builder-header-row" style="margin-bottom:12px">
                <select onchange="changeFieldType(${si},${fi},this.value)" style="flex:0">
                    ${['text','textarea','number','select','radio','checkbox','inline'].map(t =>
                        `<option value="${t}" ${field.type===t?'selected':''}>${t}</option>`
                    ).join('')}
                </select>
                <button class="btn-remove" onclick="removeField(${si},${fi})">✕</button>
            </div>
            ${renderFieldInputs(field, si, fi)}
        </div>`;
    }

    function tf(si, fi, prop, event='oninput') {
        return `${event}="sections[${si}].fields[${fi}].${prop} = this.value; updateCode()"`;
    }

    function renderFieldInputs(f, si, fi) {
        const commonLabel = `
        <div class="builder-row">
            <div class="input-group">
                <label class="builder-label">label (תווית)</label>
                <input type="text" value="${esc(f.label||'')}" placeholder="תווית השדה" ${tf(si,fi,'label')}>
            </div>
            <div class="input-group">
                <label class="builder-label">helperText <span style="font-weight:400">(אופציונלי)</span></label>
                <input type="text" value="${esc(f.helperText||'')}" placeholder="טקסט עזר קטן" ${tf(si,fi,'helperText')}>
            </div>
        </div>`;

        const idField = (placeholder='field_id') => `
        <div class="input-group">
            <label class="builder-label">id</label>
            <input type="text" value="${esc(f.id||'')}" placeholder="${placeholder}"
                oninput="sections[${si}].fields[${fi}].id = this.value; updateCode(); updateDataKeysPreview()">
        </div>`;

        const nameField = `
        <div class="input-group">
            <label class="builder-label">name (מזהה קבוצה)</label>
            <input type="text" value="${esc(f.name||'')}" placeholder="my_choice"
                oninput="sections[${si}].fields[${fi}].name = this.value; updateCode(); updateDataKeysPreview()">
        </div>`;

        switch (f.type) {

            case 'text':
            case 'textarea':
                return commonLabel + `
                <div class="builder-row">
                    ${idField()}
                    <div class="input-group">
                        <label class="builder-label">placeholder</label>
                        <input type="text" value="${esc(f.placeholder||'')}" placeholder="..." ${tf(si,fi,'placeholder')}>
                    </div>
                    ${f.type==='textarea' ? `<div class="input-group">
                        <label class="builder-label">rows</label>
                        <input type="number" value="${f.rows||4}" min="2" max="20" ${tf(si,fi,'rows')}>
                    </div>` : ''}
                    <div class="input-group" style="display:flex;align-items:center;gap:8px;padding-top:22px">
                        <input type="checkbox" id="req-${si}-${fi}" ${f.required?'checked':''}
                            onchange="sections[${si}].fields[${fi}].required = this.checked; updateCode()">
                        <label for="req-${si}-${fi}">שדה חובה</label>
                    </div>
                </div>`;

            case 'number':
                return commonLabel + `
                <div class="builder-row">
                    ${idField('count')}
                    <div class="input-group">
                        <label class="builder-label">ברירת מחדל</label>
                        <input type="number" value="${f.defaultValue||''}" ${tf(si,fi,'defaultValue')}>
                    </div>
                    <div class="input-group">
                        <label class="builder-label">min</label>
                        <input type="number" value="${f.min||''}" ${tf(si,fi,'min')}>
                    </div>
                    <div class="input-group">
                        <label class="builder-label">max</label>
                        <input type="number" value="${f.max||''}" ${tf(si,fi,'max')}>
                    </div>
                    <div class="input-group">
                        <label class="builder-label">step</label>
                        <input type="number" value="${f.step||''}" ${tf(si,fi,'step')}>
                    </div>
                </div>`;

            case 'select': {
                const opts = (f.options||[]).map((o, oi) => `
                <div class="option-row">
                    <input type="text" placeholder="value" value="${esc(o.value||'')}"
                        oninput="sections[${si}].fields[${fi}].options[${oi}].value = this.value; updateCode()">
                    <input type="text" placeholder="label" value="${esc(o.label||'')}"
                        oninput="sections[${si}].fields[${fi}].options[${oi}].label = this.value; updateCode()">
                    <label title="ברירת מחדל"><input type="checkbox" ${o.selected?'checked':''}
                        onchange="sections[${si}].fields[${fi}].options.forEach((x,i)=>x.selected=i===${oi}&&this.checked); updateCode()"> ברירת מחדל</label>
                    <button class="btn-remove" onclick="sections[${si}].fields[${fi}].options.splice(${oi},1); renderSections(); updateCode()">✕</button>
                </div>`).join('');
                return commonLabel + `
                <div class="builder-row">${idField('my_select')}</div>
                <label class="builder-label" style="margin-top:10px">אפשרויות (value | label | ברירת מחדל)</label>
                ${opts}
                <button class="btn-add-secondary"
                    onclick="sections[${si}].fields[${fi}].options.push({value:'',label:'',selected:false}); renderSections(); updateCode()">+ אפשרות</button>`;
            }

            case 'radio':
            case 'checkbox': {
                const opts = (f.options||[]).map((o, oi) => `
                <div class="option-row">
                    <input type="text" placeholder="id" value="${esc(o.id||'')}" style="flex:0.8"
                        oninput="sections[${si}].fields[${fi}].options[${oi}].id = this.value; updateCode()">
                    <input type="text" placeholder="value" value="${esc(o.value||'')}"
                        oninput="sections[${si}].fields[${fi}].options[${oi}].value = this.value; updateCode()">
                    <input type="text" placeholder="label" value="${esc(o.label||'')}"
                        oninput="sections[${si}].fields[${fi}].options[${oi}].label = this.value; updateCode()">
                    <button class="btn-remove" onclick="sections[${si}].fields[${fi}].options.splice(${oi},1); renderSections(); updateCode()">✕</button>
                </div>`).join('');
                return commonLabel + `
                <div class="builder-row">
                    ${nameField}
                    <div class="input-group">
                        <label class="builder-label">layout</label>
                        <select onchange="sections[${si}].fields[${fi}].layout = this.value; updateCode()">
                            <option value="2col" ${(f.layout||'2col')==='2col'?'selected':''}>2 עמודות</option>
                            <option value="3col" ${f.layout==='3col'?'selected':''}>3 עמודות</option>
                        </select>
                    </div>
                </div>
                <label class="builder-label" style="margin-top:10px">אפשרויות (id | value | label)</label>
                ${opts}
                <button class="btn-add-secondary"
                    onclick="sections[${si}].fields[${fi}].options.push({id:'',value:'',label:''}); renderSections(); updateCode()">+ אפשרות</button>`;
            }

            case 'inline': {
                const inlines = (f.inputs||[]).map((sub, ii) => `
                <div class="option-row">
                    <select style="flex:0" onchange="sections[${si}].fields[${fi}].inputs[${ii}].type = this.value; renderSections(); updateCode()">
                        <option value="number" ${sub.type==='number'?'selected':''}>number</option>
                        <option value="select" ${sub.type==='select'?'selected':''}>select</option>
                    </select>
                    <input type="text" placeholder="id" value="${esc(sub.id||'')}" style="flex:0.8"
                        oninput="sections[${si}].fields[${fi}].inputs[${ii}].id = this.value; updateCode(); updateDataKeysPreview()">
                    <input type="text" placeholder="helperText" value="${esc(sub.helperText||'')}"
                        oninput="sections[${si}].fields[${fi}].inputs[${ii}].helperText = this.value; updateCode()">
                    <button class="btn-remove" onclick="sections[${si}].fields[${fi}].inputs.splice(${ii},1); renderSections(); updateCode()">✕</button>
                </div>`).join('');
                return commonLabel + `
                <label class="builder-label" style="margin-top:10px">שדות פנימיים (זה לצד זה)</label>
                ${inlines}
                <button class="btn-add-secondary"
                    onclick="sections[${si}].fields[${fi}].inputs.push({type:'number',id:'',helperText:''}); renderSections(); updateCode()">+ שדה פנימי</button>`;
            }

            default:
                return commonLabel;
        }
    }

    /* ── Data keys preview ── */

    function updateDataKeysPreview() {
        const keys = [];
        sections.forEach(s => s.fields.forEach(f => {
            if (f.type === 'radio' || f.type === 'checkbox') { if (f.name) keys.push(f.name); }
            else if (f.type === 'inline') { (f.inputs||[]).forEach(sub => { if (sub.id) keys.push(sub.id); }); }
            else if (f.id) { keys.push(f.id); }
        }));
        const el = document.getElementById('data-keys-preview');
        el.innerHTML = keys.length
            ? `<strong>מפתחות זמינים ב-buildPrompt:</strong> ${keys.map(k => `<code>data.${k}</code>`).join(' · ')}`
            : '<em>הוסף שדות בשלב 2 כדי לראות מפתחות זמינים</em>';
    }

    /* ── Code generation ── */

    function q(str) { return str ? `'${String(str).replace(/'/g, "\\'")}'` : ''; }
    function esc(str) { return String(str || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

    function genFieldCode(f, indent) {
        const pad = ' '.repeat(indent);
        const props = [];
        props.push(`type: '${f.type}'`);

        switch (f.type) {
            case 'text':
            case 'textarea':
                if (f.id)          props.push(`id: ${q(f.id)}`);
                if (f.label)       props.push(`label: ${q(f.label)}`);
                if (f.type === 'textarea' && f.rows) props.push(`rows: ${f.rows}`);
                if (f.placeholder) props.push(`placeholder: ${q(f.placeholder)}`);
                if (f.required)    props.push(`required: true`);
                if (f.helperText)  props.push(`helperText: ${q(f.helperText)}`);
                break;
            case 'number':
                if (f.id)           props.push(`id: ${q(f.id)}`);
                if (f.label)        props.push(`label: ${q(f.label)}`);
                if (f.min !== '')   props.push(`min: ${f.min}`);
                if (f.max !== '')   props.push(`max: ${f.max}`);
                if (f.step !== '')  props.push(`step: ${f.step}`);
                if (f.defaultValue !== '') props.push(`defaultValue: ${f.defaultValue}`);
                if (f.helperText)   props.push(`helperText: ${q(f.helperText)}`);
                break;
            case 'select': {
                if (f.id)    props.push(`id: ${q(f.id)}`);
                if (f.label) props.push(`label: ${q(f.label)}`);
                const opts = (f.options||[]).map(o =>
                    `{ value: ${q(o.value)}, label: ${q(o.label)}${o.selected ? ', selected: true' : ''} }`
                ).join(', ');
                props.push(`options: [${opts}]`);
                if (f.helperText) props.push(`helperText: ${q(f.helperText)}`);
                break;
            }
            case 'radio':
            case 'checkbox': {
                if (f.name)   props.push(`name: ${q(f.name)}`);
                if (f.label)  props.push(`label: ${q(f.label)}`);
                if (f.layout) props.push(`layout: '${f.layout}'`);
                const opts = (f.options||[]).map(o =>
                    `{ id: ${q(o.id)}, value: ${q(o.value)}, label: ${q(o.label)} }`
                ).join(', ');
                props.push(`options: [${opts}]`);
                if (f.helperText) props.push(`helperText: ${q(f.helperText)}`);
                break;
            }
            case 'inline': {
                if (f.label) props.push(`label: ${q(f.label)}`);
                const subs = (f.inputs||[]).map(sub => {
                    const sp = [`type: '${sub.type}'`];
                    if (sub.id) sp.push(`id: ${q(sub.id)}`);
                    if (sub.helperText) sp.push(`helperText: ${q(sub.helperText)}`);
                    return `{ ${sp.join(', ')} }`;
                }).join(', ');
                props.push(`inputs: [${subs}]`);
                if (f.helperText) props.push(`helperText: ${q(f.helperText)}`);
                break;
            }
        }
        return `${pad}{ ${props.join(', ')} }`;
    }

    function genFieldsCode(sections) {
        if (!sections.length) return '[]';
        const inner = sections.map(s => {
            const fields = (s.fields||[]).map(f => genFieldCode(f, 20)).join(',\n');
            return `        {\n            section: ${q(s.title)},\n            inputs: [\n${fields}\n            ]\n        }`;
        }).join(',\n');
        return `[\n${inner}\n    ]`;
    }

    function updateCode() {
        const id          = (document.getElementById('b-id').value || '').trim();
        const title       = (document.getElementById('b-title').value || '').trim();
        const description = (document.getElementById('b-description').value || '').trim();
        const tagline     = (document.getElementById('b-tagline').value || '').trim();
        const category    = document.getElementById('b-category').value;
        const icon        = document.getElementById('b-icon').value;
        const submitLabel = (document.getElementById('b-submit').value || '').trim();
        const info        = (document.getElementById('b-info').value || '').trim();
        const promptBody  = (document.getElementById('b-prompt-body').value || '').trim();

        const lines = [];
        lines.push(`{`);
        lines.push(`    id: ${q(id)},`);
        lines.push(`    title: ${q(title)},`);
        lines.push(`    description: ${q(description)},`);
        lines.push(`    link: 'generator.html?g=${id}',`);
        lines.push(`    category: '${category}',`);
        lines.push(`    icon: ICONS.${icon},`);
        if (tagline)     lines.push(`    tagline: ${q(tagline)},`);
        if (submitLabel) lines.push(`    submitLabel: ${q(submitLabel)},`);
        if (info)        lines.push(`    info: \`${info}\`,`);
        lines.push(`    fields: ${genFieldsCode(sections)},`);
        lines.push(`    buildPrompt: function(data) {`);
        (promptBody || '// כתוב כאן את הפרומפט').split('\n').forEach(line => {
            lines.push(`        ${line}`);
        });
        lines.push(`    }`);
        lines.push(`}`);

        document.getElementById('code-output').textContent = lines.join('\n');
    }

    function copyCode() {
        const code = document.getElementById('code-output').textContent;
        navigator.clipboard.writeText(code).then(() => {
            showNotification('✅ הקוד הועתק! הדבק אותו ב-generators-config.js');
        }).catch(() => {
            showNotification('❌ שגיאה בהעתקה — נסה להעתיק ידנית', 'error');
        });
    }

    /* ── Init ── */
    document.addEventListener('DOMContentLoaded', function () {
        updateCode();
    });
    </script>
</body>
</html>
